<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="MIRIV">
  <!--
    Wine glass from lucide (ISC), the same icon family the interface uses.
    The media query lightens it on dark browser themes, where the plum would sink into the tab bar.
  -->
  <style>
    .icon { stroke: #6d4656; }
    @media (prefers-color-scheme: dark) { .icon { stroke: #f3e7ee; } }
  </style>
  <g class="icon" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 22h8"/>
    <path d="M7 10h10"/>
    <path d="M12 15v7"/>
    <path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"/>
  </g>
</svg>
